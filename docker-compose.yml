# One-command local stack: app + Postgres.
# Usage:
#   cp .env.example .env        # fill in real values
#   docker compose up -d
#   open http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ugs
      POSTGRES_PASSWORD: ugs
      POSTGRES_DB: ugs
    volumes:
      - ugs-pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugs -d ugs"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ugs:ugs@db:5432/ugs
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
      # NEXTAUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY,
      # CRON_SECRET must be set in your shell or via a .env file. See .env.example.
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  ugs-pg:
